# ========================
# Datasource MySQL
# ========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/newsly?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
# JPA / Hibernate
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================
# Aplicação
# ========================
spring.application.name=newsly
server.port=8080

# ========================
# Validação de CNPJ
# Desabilitada por padrão; pode ser ativada com NEWSLY_CNPJ_VALIDATION_ENABLED=true.
# ========================
newsly.cnpj-validation.enabled=${NEWSLY_CNPJ_VALIDATION_ENABLED:false}

# ========================
# Upload de arquivos
# ========================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ========================
# Armazenamento local
# Altere para o caminho absoluto desejado no seu servidor
# ========================
storage.local.path=uploads

# ========================
# Segurança da API
# Configure os valores via variáveis de ambiente em cada ambiente.
# ========================
